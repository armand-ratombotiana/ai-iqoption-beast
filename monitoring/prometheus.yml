global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'kael-trading-bot'

scrape_configs:
  # KAEL Trading Bot metrics
  - job_name: 'kael-bot'
    static_configs:
      - targets: ['kael-parallel-trading-bot:5001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # TimescaleDB metrics (if postgres_exporter is added)
  - job_name: 'timescaledb'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
