version: '3.8'

services:
  trading-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iqoption-trading-bot
    ports:
      - "5000:5000"
    environment:
      # Risk Management
      - MAX_DAILY_LOSS=50
      - MAX_DAILY_PROFIT=100
      - MAX_CONSECUTIVE_LOSSES=3
      - MIN_BALANCE=50

      # Martingale
      - MARTINGALE_MULTIPLIER=1.5
      - MAX_MARTINGALE_LEVEL=4

      # Trading
      - MIN_CONFIDENCE_THRESHOLD=60
      - BASE_TRADE_AMOUNT=1
      - MAX_TRADE_MULTIPLIER=5

      # API
      - PORT=5000
      - DEBUG=false
    volumes:
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
