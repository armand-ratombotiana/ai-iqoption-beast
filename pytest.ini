[pytest]
# Pytest configuration for KAEL Trading System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests advanced_trading_system/tests

# Markers for categorizing tests
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires real API credentials)
    slow: Slow tests (trade execution, waiting for results)
    ai: AI model tests (requires API keys)
    data: Data ingestion tests
    trading: Trading execution tests
    demo_only: Tests that must run in DEMO mode only

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=advanced_trading_system
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=60

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (prevent hanging)
timeout = 300

# Minimum Python version
minversion = 3.8

# Test execution order
# Run fast tests first, slow tests last
console_output_style = progress
