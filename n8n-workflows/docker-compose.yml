version: '3.8'

# =====================================================
# IQOption AI Trading System - Docker Compose
# =====================================================
# Complete stack: n8n + PostgreSQL + Adminer
# =====================================================

services:
  # =====================================================
  # PostgreSQL Database
  # =====================================================
  postgres:
    image: postgres:15-alpine
    container_name: iqoption_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iqoption_trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas/postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network

  # =====================================================
  # n8n Workflow Automation
  # =====================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: iqoption_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-iqoption_trading}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-trading_user}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}

      # n8n Configuration
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}

      # Execution
      EXECUTIONS_MODE: ${EXECUTIONS_MODE:-regular}
      EXECUTIONS_TIMEOUT: -1
      EXECUTIONS_TIMEOUT_MAX: -1

      # AI API Keys (load from .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

      # IQOption Configuration
      IQOPTION_EMAIL: ${IQOPTION_EMAIL}
      IQOPTION_PASSWORD: ${IQOPTION_PASSWORD}
      IQOPTION_ACCOUNT_TYPE: ${IQOPTION_ACCOUNT_TYPE:-demo}
      IQOPTION_API_URL: ${IQOPTION_API_URL:-http://host.docker.internal:5000}

      # Email Configuration
      N8N_SMTP_USER: ${N8N_SMTP_USER}
      N8N_SMTP_PASS: ${N8N_SMTP_PASS}
      N8N_SMTP_HOST: ${N8N_SMTP_HOST:-smtp.gmail.com}
      N8N_SMTP_PORT: ${N8N_SMTP_PORT:-587}
      N8N_EMAIL_TO: ${N8N_EMAIL_TO}
      N8N_EMAIL_MODE: ${N8N_EMAIL_MODE:-per_trade}

      # Google Sheets
      N8N_GOOGLE_SHEETS_ID: ${N8N_GOOGLE_SHEETS_ID}

      # Trading Configuration
      N8N_TRADE_INTERVAL_MINUTES: ${N8N_TRADE_INTERVAL_MINUTES:-1}
      N8N_TRADE_AMOUNT: ${N8N_TRADE_AMOUNT:-1}
      N8N_TRADE_ASSET: ${N8N_TRADE_ASSET:-EURUSD}
      N8N_MIN_CONFIDENCE: ${N8N_MIN_CONFIDENCE:-70}
      N8N_MAX_DAILY_TRADES: ${N8N_MAX_DAILY_TRADES:-100}
      N8N_MAX_DAILY_LOSS: ${N8N_MAX_DAILY_LOSS:-1000}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    networks:
      - trading_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =====================================================
  # Adminer - Database Management UI (Optional)
  # =====================================================
  adminer:
    image: adminer:latest
    container_name: iqoption_adminer
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "8080:8080"
    networks:
      - trading_network

  # =====================================================
  # IQOption API Server (Python)
  # =====================================================
  # Uncomment if you want to run the API server in Docker
  # iqoption_api:
  #   build:
  #     context: ../advanced_trading_system
  #     dockerfile: Dockerfile
  #   container_name: iqoption_api
  #   restart: unless-stopped
  #   environment:
  #     IQOPTION_EMAIL: ${IQOPTION_EMAIL}
  #     IQOPTION_PASSWORD: ${IQOPTION_PASSWORD}
  #     IQOPTION_ACCOUNT_TYPE: ${IQOPTION_ACCOUNT_TYPE:-demo}
  #     API_PORT: 5000
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - api_logs:/app/logs
  #   networks:
  #     - trading_network

# =====================================================
# Networks
# =====================================================
networks:
  trading_network:
    driver: bridge
    name: iqoption_trading_network

# =====================================================
# Volumes
# =====================================================
volumes:
  postgres_data:
    name: iqoption_postgres_data
  n8n_data:
    name: iqoption_n8n_data
  # api_logs:
  #   name: iqoption_api_logs

# =====================================================
# Usage Instructions
# =====================================================
#
# 1. Copy .env.example to .env and configure
#
# 2. Start services:
#    docker-compose up -d
#
# 3. Check logs:
#    docker-compose logs -f n8n
#    docker-compose logs -f postgres
#
# 4. Access services:
#    - n8n: http://localhost:5678
#    - Adminer: http://localhost:8080
#      (Server: postgres, Username: trading_user, Database: iqoption_trading)
#
# 5. Import workflows:
#    - Open n8n UI
#    - Import from workflows/ directory
#    - Configure credentials
#    - Activate Main_Trading_Workflow
#
# 6. Stop services:
#    docker-compose down
#
# 7. Remove all data (CAREFUL!):
#    docker-compose down -v
#
# =====================================================
