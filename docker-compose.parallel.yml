services:
  # ============================================================================
  # KAEL Autonomous Parallel Trading Bot - Optimized 24/7 Trading
  # ============================================================================
  parallel-trading-bot:
    build:
      context: .
      dockerfile: Dockerfile.parallel
    container_name: kael-parallel-trading-bot
    restart: unless-stopped

    environment:
      # ========================================================================
      # IQ OPTION CREDENTIALS (REQUIRED)
      # ========================================================================
      - IQOPTION_EMAIL=${IQOPTION_EMAIL}
      - IQOPTION_PASSWORD=${IQOPTION_PASSWORD}
      
      # ========================================================================
      # TRADING MODE
      # ========================================================================
      - TRADING_MODE=${TRADING_MODE:-demo}

      # ========================================================================
      # PARALLEL TRADING SETTINGS (OPTIMIZED for timing)
      # ========================================================================
      - MAX_CONCURRENT_INSTRUMENTS=${MAX_CONCURRENT_INSTRUMENTS:-20}
      - MAX_INSTRUMENTS_TO_MONITOR=${MAX_INSTRUMENTS_TO_MONITOR:-50}
      - PORTFOLIO_RISK_PERCENT=${PORTFOLIO_RISK_PERCENT:-10.0}
      - MAX_RISK_PER_INSTRUMENT=${MAX_RISK_PER_INSTRUMENT:-2.5}
      - INSTRUMENT_SCAN_INTERVAL=${INSTRUMENT_SCAN_INTERVAL:-3}
      - MAX_WORKER_THREADS=${MAX_WORKER_THREADS:-15}
      - MAX_TRADES_PER_INSTRUMENT_HOUR=${MAX_TRADES_PER_INSTRUMENT_HOUR:-60}

      # ========================================================================
      # BINARY OPTIONS SETTINGS
      # ========================================================================
      - BASE_TRADE_AMOUNT=${BASE_TRADE_AMOUNT:-1.0}
      - MAX_TRADE_AMOUNT=${MAX_TRADE_AMOUNT:-10.0}
      - TRADING_ASSETS=${TRADING_ASSETS:-EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,NZDUSD,EURJPY,GBPJPY,EURGBP,AUDJPY,EURAUD,GBPAUD,USDCHF,EURCAD,GBPCAD,AUDCAD}

      # ========================================================================
      # RISK MANAGEMENT
      # ========================================================================
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-50}
      - MAX_DAILY_PROFIT=${MAX_DAILY_PROFIT:-100}
      - MAX_CONSECUTIVE_LOSSES=${MAX_CONSECUTIVE_LOSSES:-5}
      - MIN_BALANCE=${MIN_BALANCE:-50}
      - MAX_TRADES_PER_HOUR=${MAX_TRADES_PER_HOUR:-300}
      - MAX_TRADES_PER_DAY=${MAX_TRADES_PER_DAY:-7200}

      # ========================================================================
      # AI SIGNAL REQUIREMENTS (OPTIMIZED for execution rate)
      # ========================================================================
      - MIN_AI_CONFIDENCE=${MIN_AI_CONFIDENCE:-60}

      # ========================================================================
      # AI API KEYS (Optional)
      # ========================================================================
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}

      # ========================================================================
      # HEALTH MONITORING
      # ========================================================================
      - ENABLE_HEALTH_API=${ENABLE_HEALTH_API:-true}
      - HEALTH_API_PORT=${HEALTH_API_PORT:-5001}
      # Database URL (optional) - when provided, bot will use Postgres/Timescale
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@timescaledb:5432/kael}

      # ========================================================================
      # LOGGING
      # ========================================================================
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    ports:
      # Health API endpoint
      - "5001:5001"

    volumes:
      # Persist logs outside container
      - ./logs:/app/app/KAEL/KAEL/logs
      # Persist database outside container (NEW: comprehensive trade logging)
      - ./database_files:/app/app/KAEL/KAEL/database_files
      # Mount .env file (read-only)
      - ./.env:/app/app/KAEL/KAEL/.env:ro

    networks:
      - trading-network

    # Health monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: kael-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kael}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - trading-network

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kael-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - trading-network
    depends_on:
      - parallel-trading-bot

  # ============================================================================
  # GRAFANA - Metrics Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: kael-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - trading-network
    depends_on:
      - prometheus

  # ============================================================================
  # POSTGRES EXPORTER - Database Metrics
  # ============================================================================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: kael-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@timescaledb:5432/kael?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - trading-network
    depends_on:
      - timescaledb

  # ============================================================================
  # ANGULAR DASHBOARD - Modern Trading UI
  # ============================================================================
  dashboard-ui:
    build:
      context: ./dashboard-ui
      dockerfile: Dockerfile
    container_name: kael-dashboard-ui
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - trading-network
    depends_on:
      - parallel-trading-bot
      - grafana
      - prometheus
    environment:
      - API_URL=http://kael-parallel-trading-bot:5001
      - GRAFANA_URL=http://grafana:3000
      - PROMETHEUS_URL=http://prometheus:9090

networks:
  trading-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

  # Optional TimescaleDB/Postgres service used by the bot when DATABASE_URL is set
  # NOTE: defined as a sibling service to parallel-trading-bot above
  
