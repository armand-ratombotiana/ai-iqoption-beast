global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'kael-trading-bot'

scrape_configs:
  # KAEL Ultimate Strategy Evaluator metrics
  - job_name: 'kael-ultimate-evaluator'
    static_configs:
      - targets: ['ultimate-evaluator:5001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # TimescaleDB metrics (if postgres_exporter is added)
  - job_name: 'timescaledb'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
