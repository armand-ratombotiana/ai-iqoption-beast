version: '3.8'

services:
  # ============================================================================
  # KAEL Ultimate Strategy Evaluator - 10+ Binary Option Strategies
  # ============================================================================
  ultimate-evaluator:
    build:
      context: .
      dockerfile: Dockerfile.parallel
    container_name: kael-ultimate-evaluator
    restart: unless-stopped

    environment:
      # ========================================================================
      # CREDENTIALS (REQUIRED)
      # ========================================================================
      - IQOPTION_EMAIL=${IQOPTION_EMAIL}
      - IQOPTION_PASSWORD=${IQOPTION_PASSWORD}

      # ========================================================================
      # TRADING MODE (CRITICAL: Change to 'live' for real money trading)
      # ========================================================================
      - TRADING_MODE=${TRADING_MODE:-demo}

      # ========================================================================
      # FICTITIOUS BALANCE (for realistic testing)
      # ========================================================================
      - ENABLE_FICTITIOUS_BALANCE=true
      - FICTITIOUS_START_BALANCE=100.0

      # ========================================================================
      # STRATEGY SETTINGS
      # ========================================================================
      - USE_ADVANCED_STRATEGIES=true
      - MIN_CONFIDENCE_BASE=0.70
      - STRATEGY_SCAN_INTERVAL=5

      # ========================================================================
      # BINARY OPTIONS SETTINGS
      # ========================================================================
      - BASE_TRADE_AMOUNT=${BASE_TRADE_AMOUNT:-1.0}
      - MIN_PAYOUT_RATIO=0.65
      - TRADING_ASSETS=${TRADING_ASSETS:-EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,NZDUSD,EURJPY,GBPJPY,EURGBP,AUDJPY}

      # ========================================================================
      # RISK MANAGEMENT
      # ========================================================================
      - MAX_CONSECUTIVE_LOSSES=5
      - MAX_DAILY_LOSS=10.0
      - MIN_BALANCE=50
      - MIN_SECONDS_BETWEEN_TRADES=70

      # ========================================================================
      # TIMING
      # ========================================================================
      - WAIT_FOR_RESULT_SECONDS=65

      # ========================================================================
      # API RATE LIMITING
      # ========================================================================
      - API_MIN_INTERVAL=0.3
      - API_MAX_RETRIES=3

      # ========================================================================
      # HEALTH MONITORING
      # ========================================================================
      - ENABLE_HEALTH_API=true
      - HEALTH_API_PORT=5001

      # ========================================================================
      # DATABASE (for AI data collection and advanced logging)
      # ========================================================================
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/kael
      - ENABLE_DATABASE_LOGGING=true

      # ========================================================================
      # AI DATA COLLECTION (for custom model training)
      # ========================================================================
      - ENABLE_AI_DATA_COLLECTION=true
      - AI_COLLECT_MARKET_SNAPSHOTS=true
      - AI_SNAPSHOT_INTERVAL=60
      - AI_COLLECT_FEATURES=true

      # ========================================================================
      # BINARY OPTIONS ENGINE
      # ========================================================================
      - USE_BINARY_ENGINE=true
      - BINARY_ENGINE_MIN_CONFIDENCE=0.70
      - BINARY_ENGINE_MAX_TRADES_PER_HOUR=10

      # ========================================================================
      # ADVANCED STRATEGIES MODULE
      # ========================================================================
      - ADVANCED_STRATEGIES_ENABLED=true
      - STRATEGIES_TO_EVALUATE=enhanced_candle_count,rsi_divergence,macd_momentum,bollinger_rsi_combo,stochastic,support_resistance,trend_alignment

      # ========================================================================
      # LOGGING
      # ========================================================================
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_DETAILED_LOGGING=true

    ports:
      # Health API endpoint
      - "5001:5001"

    volumes:
      # Persist logs outside container
      - ./logs:/app/app/KAEL/KAEL/logs
      # Persist reports
      - ./reports:/app/app/KAEL/KAEL/reports
      # Mount .env file (read-only)
      - ./.env:/app/app/KAEL/KAEL/.env:ro

    networks:
      - trading-network

    # Health monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Optional: Connect to TimescaleDB if you want database logging
    depends_on:
      timescaledb:
        condition: service_healthy

  # ============================================================================
  # TIMESCALEDB - Time-series database (OPTIONAL but recommended)
  # ============================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: kael-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kael}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      # Initialize both multi-account schema and AI schema
      - ./database/multi_account_schema.sql:/docker-entrypoint-initdb.d/01-multi-account-schema.sql:ro
      - ./database/init_ai_schema.sql:/docker-entrypoint-initdb.d/02-ai-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kael-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - trading-network
    depends_on:
      - ultimate-evaluator

  # ============================================================================
  # GRAFANA - Metrics Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: kael-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - trading-network
    depends_on:
      - prometheus

  # ============================================================================
  # REACT DASHBOARD - Modern UI for Strategy Evaluation
  # ============================================================================
  dashboard-react:
    build:
      context: ./dashboard-ui-react
      dockerfile: Dockerfile
    container_name: kael-dashboard-react
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - trading-network
    depends_on:
      ultimate-evaluator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # ANGULAR DASHBOARD - Alternative UI for Strategy Evaluation
  # ============================================================================
  dashboard-angular:
    build:
      context: ./dashboard-ui
      dockerfile: Dockerfile
    container_name: kael-dashboard-angular
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - trading-network
    depends_on:
      ultimate-evaluator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trading-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
