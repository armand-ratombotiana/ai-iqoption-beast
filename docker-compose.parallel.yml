services:
  # ============================================================================
  # KAEL Multi-Account Parallel Trading Bot - 5 Accounts with Different Strategies
  # ============================================================================
  parallel-trading-bot:
    build:
      context: .
      dockerfile: Dockerfile.parallel
    container_name: kael-parallel-trading-bot
    restart: unless-stopped

    environment:
      # ========================================================================
      # MULTI-ACCOUNT MODE (NEW)
      # ========================================================================
      - ENABLE_MULTI_ACCOUNT=${ENABLE_MULTI_ACCOUNT:-true}
      
      # ========================================================================
      # IQ OPTION CREDENTIALS (REQUIRED - Primary account for single-account mode)
      # ========================================================================
      - IQOPTION_EMAIL=${IQOPTION_EMAIL}
      - IQOPTION_PASSWORD=${IQOPTION_PASSWORD}
      
      # ========================================================================
      # TRADING MODE
      # ========================================================================
      - TRADING_MODE=${TRADING_MODE:-demo}

      # ========================================================================
      # PARALLEL TRADING SETTINGS (OPTIMIZED for timing)
      # ========================================================================
      - MAX_CONCURRENT_INSTRUMENTS=${MAX_CONCURRENT_INSTRUMENTS:-20}
      - MAX_INSTRUMENTS_TO_MONITOR=${MAX_INSTRUMENTS_TO_MONITOR:-50}
      - PORTFOLIO_RISK_PERCENT=${PORTFOLIO_RISK_PERCENT:-10.0}
      - MAX_RISK_PER_INSTRUMENT=${MAX_RISK_PER_INSTRUMENT:-2.5}
      - INSTRUMENT_SCAN_INTERVAL=${INSTRUMENT_SCAN_INTERVAL:-3}
      - MAX_WORKER_THREADS=${MAX_WORKER_THREADS:-15}
      - MAX_TRADES_PER_INSTRUMENT_HOUR=${MAX_TRADES_PER_INSTRUMENT_HOUR:-60}

      # ========================================================================
      # BINARY OPTIONS SETTINGS
      # ========================================================================
      - BASE_TRADE_AMOUNT=${BASE_TRADE_AMOUNT:-1.0}
      - MAX_TRADE_AMOUNT=${MAX_TRADE_AMOUNT:-10.0}
      - TRADING_ASSETS=${TRADING_ASSETS:-EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,NZDUSD,EURJPY,GBPJPY,EURGBP,AUDJPY,EURAUD,GBPAUD,USDCHF,EURCAD,GBPCAD,AUDCAD}

      # ========================================================================
      # RISK MANAGEMENT
      # ========================================================================
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-50}
      - MAX_DAILY_PROFIT=${MAX_DAILY_PROFIT:-100}
      - MAX_CONSECUTIVE_LOSSES=${MAX_CONSECUTIVE_LOSSES:-5}
      - MIN_BALANCE=${MIN_BALANCE:-50}
      - MAX_TRADES_PER_HOUR=${MAX_TRADES_PER_HOUR:-300}
      - MAX_TRADES_PER_DAY=${MAX_TRADES_PER_DAY:-7200}

      # ========================================================================
      # AI SIGNAL REQUIREMENTS (OPTIMIZED for execution rate)
      # ========================================================================
      - MIN_AI_CONFIDENCE=${MIN_AI_CONFIDENCE:-60}

      # ========================================================================
      # ADVANCED STRATEGIES (NEW)
      # ========================================================================
      - USE_ADVANCED_STRATEGIES=${USE_ADVANCED_STRATEGIES:-true}
      - STRATEGY_RISK_PROFILE=${STRATEGY_RISK_PROFILE:-moderate}

      # ========================================================================
      # AI API KEYS (Optional)
      # ========================================================================
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}

      # ========================================================================
      # HEALTH MONITORING
      # ========================================================================
      - ENABLE_HEALTH_API=${ENABLE_HEALTH_API:-true}
      - HEALTH_API_PORT=${HEALTH_API_PORT:-5001}
      
      # ========================================================================
      # DATABASE (REQUIRED for multi-account)
      # ========================================================================
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@timescaledb:5432/kael}

      # ========================================================================
      # LOGGING
      # ========================================================================
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    ports:
      # Health API endpoint
      - "5001:5001"

    volumes:
      # Persist logs outside container
      - ./logs:/app/app/KAEL/KAEL/logs
      # Persist database files
      - ./database_files:/app/app/KAEL/KAEL/database_files
      # Persist config (for accounts.json)
      - ./config:/app/app/KAEL/KAEL/config
      # Persist reports
      - ./reports:/app/app/KAEL/KAEL/reports
      # Mount .env file (read-only)
      - ./.env:/app/app/KAEL/KAEL/.env:ro

    networks:
      - trading-network

    depends_on:
      timescaledb:
        condition: service_healthy

    # Health monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # TIMESCALEDB - Time-series database for multi-account tracking
  # ============================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: kael-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kael}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./database/multi_account_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kael-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - trading-network
    depends_on:
      - parallel-trading-bot

  # ============================================================================
  # GRAFANA - Metrics Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: kael-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - trading-network
    depends_on:
      - prometheus

  # ============================================================================
  # POSTGRES EXPORTER - Database Metrics
  # ============================================================================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: kael-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@timescaledb:5432/kael?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - trading-network
    depends_on:
      - timescaledb

networks:
  trading-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: